<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: #0a1409;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Georgia, serif;
        color: #d6ecc8;
      }
      h1 {
        font-size: 32px;
        font-style: italic;
        font-weight: 300;
        margin-bottom: 8px;
      }
      p {
        font-family: monospace;
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(140, 185, 100, 0.4);
      }
      .kanji {
        font-size: 80px;
        color: rgba(255, 255, 255, 0.03);
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <h1>The garden rests.</h1>
    <p>reconnect to continue growing</p>
    <div class="kanji">習</div>
